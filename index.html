<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Diff Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #282c34;
            color: #abb2bf;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #toolbar, #footer {
            padding: 1rem;
            background-color: #21252b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #toolbar {
            border-bottom: 1px solid #181a1f;
        }

        #footer {
            border-top: 1px solid #181a1f;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            background-color: #4b5263;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #5c6370;
        }

        #editor-container {
            flex-grow: 1;
            padding: 1rem;
            box-sizing: border-box;
            display: flex;
            overflow: hidden;
            min-height: 0;
        }

        /* Override CM mergeview styles to fill container */
        .cm-mergeView {
            flex-grow: 1;
            height: 100%;
            border: 1px solid #181a1f;
            border-radius: 6px;
            display: flex !important;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .cm-mergeViewEditors {
            flex-grow: 1;
            display: flex;
            align-items: stretch;
            min-height: 0;
        }

        .cm-mergeViewEditor {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .cm-mergeView .cm-editor {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .cm-scroller {
            flex-grow: 1;
            overflow: auto !important;
            min-height: 0;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #abb2bf;
        }

        .checkbox-container input {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="clear-left-btn" class="action-btn">清空左側</button>
        <button id="force-diff-btn" class="action-btn">重新比對</button>
        <button id="clear-right-btn" class="action-btn">清空右側</button>
    </div>
    <div id="editor-container"></div>
    <div id="footer">
        <button id="download-left-btn" class="action-btn">下載左邊</button>
        <div class="checkbox-container">
            <input type="checkbox" id="sync-scroll-checkbox" checked>
            <label for="sync-scroll-checkbox">同步捲動</label>
        </div>
        <button id="scroll-top-btn" class="action-btn">滾動回頂端</button>
        <button id="download-right-btn" class="action-btn">下載右邊</button>
    </div>
    <script type="module" src="./dist/app.bundle.js"></script>
</body>
</html>
