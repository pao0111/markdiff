<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Diff Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #282c34;
            color: #abb2bf;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 1rem;
            background-color: #21252b;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid #181a1f;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .header-btn {
            padding: 0.5rem 1rem;
            background-color: #4b5263;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .header-btn:hover {
            background-color: #5c6370;
        }

        #editor-container {
            flex-grow: 1;
            padding: 1rem;
            box-sizing: border-box;
            display: flex;
        }

        /* Override CM mergeview styles to fill container */
        .cm-mergeView {
            flex-grow: 1;
            height: 100%;
            border: 1px solid #181a1f;
            border-radius: 6px;
            overflow: hidden;
        }

        .cm-mergeView .cm-editor {
            height: 100%;
        }
    </style>
</head>
<body>
    <header>
        Markdown Diff
        <div id="btn-group" style="position: absolute; right: 1rem; display: flex; gap: 0.5rem;">
            <button id="clear-left-btn" class="header-btn">清空左側</button>
            <button id="clear-right-btn" class="header-btn">清空右側</button>
            <button id="force-diff-btn" class="header-btn">重新比對</button>
        </div>
    </header>
    <div id="editor-container"></div>
    <script type="module" src="./dist/app.bundle.js"></script>
</body>
</html>
